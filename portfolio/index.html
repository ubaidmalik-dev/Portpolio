<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ubaid Ur Rahman | CV</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #08131d;
        color: #e6f1ff;
        font-family: Arial, sans-serif;
      }
      .card {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid #2dd4bf;
        border-radius: 16px;
        padding: 32px 40px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(45, 212, 191, 0.2);
      }
      h1 {
        margin-bottom: 12px;
        font-size: clamp(1.6rem, 2vw, 2.2rem);
      }
      p { margin: 0 0 20px; color: #cbd5e1; }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 10px;
        background: linear-gradient(135deg, #14b8a6, #3b82f6);
        color: white;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover { opacity: 0.95; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Ubaid Ur Rahman</h1>
      <p>Updated CV is available below.</p>
      <a href="assets/Ubaid_CV_Updated.pdf" download="Ubaid_CV_Updated.pdf">Download Updated CV</a>
    </div>
  </body>
